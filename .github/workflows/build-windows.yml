# Builds the LTA Watcher Windows installer.
#  - Every push to main: builds and keeps the installer as a downloadable "artifact" (for testing).
#  - Publishing a GitHub Release (tag like v1.0.1, made on github.com or by pushing the tag):
#    builds and attaches the installer to it. Every LTA PC sees the new release and can update
#    itself from Settings > Check for updates.
name: Build Windows installer
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Read version
        id: v
        shell: pwsh
        run: |
          $v = (Select-String -Path desktop\lta_watcher\__init__.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") { throw "Tag ${{ github.ref_name }} does not match VERSION $v in desktop/lta_watcher/__init__.py" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt pyinstaller
          choco install innosetup -y --no-progress
      - name: Build app
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name "LTA Watcher" `
            --icon desktop\assets\lta.ico --paths desktop `
            --add-data "desktop\lta_watcher\ui;ui" --add-data "watcher\watch.py;watcher" `
            --hidden-import pystray._win32 desktop\run_lta_watcher.py
      - name: Smoke test (app starts and serves its screen)
        shell: pwsh
        run: |
          $env:LTA_WATCHER_HOME = "$env:RUNNER_TEMP\ltaw"
          $p = Start-Process -FilePath "dist\LTA Watcher\LTA Watcher.exe" -ArgumentList "--headless","--no-browser" -PassThru
          Start-Sleep -Seconds 12
          $port = Get-Content "$env:LTA_WATCHER_HOME\ui_port"
          $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/"
          if ($r.Content -notmatch "LTA Watcher") { throw "screen did not load" }
          Stop-Process -Id $p.Id -Force
      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.v.outputs.version }} desktop\installer.iss'
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: LTA-Watcher-Setup-${{ steps.v.outputs.version }}
          path: dist/LTA-Watcher-Setup-*.exe
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LTA-Watcher-Setup-*.exe
          generate_release_notes: true
